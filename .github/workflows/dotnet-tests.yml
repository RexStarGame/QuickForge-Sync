name: QuickForge Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v0.2.1-dev-auth-settings
  pull_request:
    branches:
      - main
      - v0.2.1-dev-auth-settings

jobs:
  test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore "QuickForge.Tests/QuickForge.Tests.csproj"

      - name: Build
        run: dotnet build "QuickForge.Tests/QuickForge.Tests.csproj" --no-restore

      - name: Run tests
        run: dotnet test "QuickForge.Tests/QuickForge.Tests.csproj" --no-build --logger "console;verbosity=normal"
