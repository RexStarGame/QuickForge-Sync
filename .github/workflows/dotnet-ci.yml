name: QuickForge Sync CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore "QuickForge.Tests\QuickForge.Tests.csproj"

      - name: Build
        run: dotnet build "QuickForge.Tests\QuickForge.Tests.csproj" --configuration Release --no-restore

      - name: Test
        run: dotnet test "QuickForge.Tests\QuickForge.Tests.csproj" --configuration Release --no-build --logger "console;verbosity=normal"
